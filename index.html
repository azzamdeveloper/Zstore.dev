<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Z Store</title>
<style>:root{--bg:#0a0f1a;--panel:#111a2b;--panel2:#16223a;--line:#243252;--fg:#e9eef8;--muted:#93a2bf;--accent:#f2c14e;--ink:#1b1403;--blue:#5aa9ff;--ok:#4cd18a;--bad:#ff7a7a;--warn:#f2a34e;color-scheme:dark}
@media(prefers-color-scheme:light){:root:not([data-t=d]){--bg:#f3f6fc;--panel:#fff;--panel2:#eaf0fb;--line:#cdd8ec;--fg:#0f1a2e;--muted:#53627f;--accent:#e0a316;--blue:#1f6fd6;--ok:#138a50;--bad:#c43a3a;--warn:#b86a0a;color-scheme:light}}
*{box-sizing:border-box}[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
a{color:var(--blue)}
.top{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:20px;padding:12px max(16px,4vw);background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.logo{display:flex;align-items:center;gap:10px;font-weight:800;font-size:19px;color:var(--fg);text-decoration:none;letter-spacing:.01em}
.logo i{width:14px;height:14px;border-radius:4px;background:var(--accent)}
#nav{display:flex;gap:4px;flex:1}#nav a{color:var(--muted);text-decoration:none;padding:8px 12px;border-radius:8px;font-weight:600;font-size:15px}#nav a:hover{color:var(--fg)}#nav a.on{color:var(--fg);background:var(--panel2)}
.live{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted)}.live b{width:8px;height:8px;border-radius:50%;background:var(--bad)}.live.on b{background:var(--ok);box-shadow:0 0 0 4px color-mix(in srgb,var(--ok) 25%,transparent)}
main{max-width:1060px;margin:0 auto;padding:28px max(16px,4vw) 70px;display:flex;flex-direction:column;gap:22px}
h1{font-size:clamp(28px,5vw,42px);line-height:1.1;margin:0;letter-spacing:-.01em}h2{font-size:22px;margin:0}h3{font-size:17px;margin:0}
.lede{color:var(--muted);max-width:60ch;margin:6px 0 0}
.muted{color:var(--muted)}.small{font-size:13px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:20px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
.app{display:flex;flex-direction:column;gap:10px;text-decoration:none;color:inherit;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;transition:transform .15s,border-color .15s}
.app:hover{transform:translateY(-2px);border-color:var(--muted)}.app.new{animation:pop .7s cubic-bezier(.2,1.3,.4,1)}
@keyframes pop{from{transform:scale(.85);opacity:0;border-color:var(--accent)}}
.ico{width:56px;height:56px;border-radius:15px;display:grid;place-items:center;font-weight:800;font-size:24px;color:#fff;flex:none}
.row{display:flex;align-items:center;gap:12px;flex-wrap:wrap}.sp{flex:1}
.badges{display:flex;gap:6px;flex-wrap:wrap}
.b{font:600 11.5px/1 ui-monospace,Consolas,monospace;padding:5px 7px;border-radius:6px;border:1px solid var(--line);background:var(--panel2);color:var(--fg);white-space:nowrap}
.b.zsai{color:var(--accent);border-color:color-mix(in srgb,var(--accent) 50%,var(--line))}.b.igrs{color:var(--blue);border-color:color-mix(in srgb,var(--blue) 50%,var(--line))}
.b.a18{color:var(--bad);border-color:var(--bad)}.b.ok{color:var(--ok)}.b.warn{color:var(--warn)}.b.bad{color:var(--bad)}
.btn{all:unset;box-sizing:border-box;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--accent);color:var(--ink);font-weight:700;font-size:15px;padding:11px 18px;border-radius:10px}
.btn:hover{filter:brightness(1.07)}.btn:focus-visible,.in:focus-visible{outline:2px solid var(--blue);outline-offset:2px}.btn[disabled]{opacity:.55;cursor:not-allowed}
.btn.g{background:var(--panel2);color:var(--fg);border:1px solid var(--line)}.btn.r{background:var(--bad);color:#fff}.btn.s{padding:7px 12px;font-size:13.5px}
.in{all:unset;box-sizing:border-box;width:100%;padding:11px 13px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--fg);font-size:15px}
textarea.in{min-height:110px;resize:vertical;line-height:1.5}select.in{appearance:auto}
label{display:grid;gap:6px;font-weight:600;font-size:14px}label small{font-weight:400;color:var(--muted)}
.form{display:grid;gap:14px;max-width:640px}.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.msg{padding:11px 14px;border-radius:10px;font-size:14.5px;border:1px solid var(--line);background:var(--panel2)}.msg.bad{border-color:var(--bad);color:var(--bad)}.msg.ok{border-color:var(--ok);color:var(--ok)}.msg.warn{border-color:var(--warn);color:var(--warn)}
.search{display:flex;gap:10px;flex-wrap:wrap}.search .in{flex:1;min-width:200px}
.tabs{display:flex;gap:6px;flex-wrap:wrap}.tabs button{all:unset;cursor:pointer;padding:8px 14px;border-radius:999px;border:1px solid var(--line);font-weight:600;font-size:14px;color:var(--muted)}.tabs button.on{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.pre{white-space:pre-wrap;overflow-wrap:anywhere}
.kv{display:grid;grid-template-columns:140px 1fr;gap:6px 14px;font-size:14.5px}.kv dt{color:var(--muted)}.kv dd{margin:0;overflow-wrap:anywhere}
.qr{background:#fff;border-radius:14px;padding:6px;width:min(100%,380px)}.qr img{display:block;width:100%;height:auto;border-radius:10px}
.steps{counter-reset:s;display:grid;gap:10px;margin:0;padding:0;list-style:none}.steps li{counter-increment:s;display:flex;gap:12px}.steps li:before{content:counter(s);flex:none;width:26px;height:26px;border-radius:50%;background:var(--accent);color:var(--ink);font-weight:800;display:grid;place-items:center;font-size:13px}
.bar{height:8px;border-radius:99px;background:var(--panel2);overflow:hidden}.bar i{display:block;height:100%;background:var(--accent);transition:width .6s linear}
.docs{display:grid;grid-template-columns:240px 1fr;gap:26px;align-items:start}.dnav{position:sticky;top:76px;display:grid;gap:2px;max-height:calc(100vh - 100px);overflow:auto}
.dnav h4{margin:14px 0 4px;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}.dnav a{color:var(--muted);text-decoration:none;padding:6px 10px;border-radius:8px;font-size:14.5px}.dnav a:hover{color:var(--fg)}.dnav a.on{background:var(--panel2);color:var(--fg);font-weight:600}
.doc h1{font-size:30px}.doc h2{margin-top:26px;font-size:20px}.doc p,.doc li{max-width:72ch}.doc code{font-family:ui-monospace,Consolas,monospace;background:var(--panel2);padding:2px 6px;border-radius:5px;font-size:.92em}
.doc pre{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:14px;overflow:auto;font-size:13.5px;line-height:1.5}.doc pre code{background:none;padding:0}
.doc table{border-collapse:collapse;width:100%;font-size:14.5px}.doc th,.doc td{border:1px solid var(--line);padding:8px 10px;text-align:left}.doc th{background:var(--panel2)}
.doc .next{display:flex;justify-content:space-between;gap:12px;margin-top:30px;padding-top:16px;border-top:1px solid var(--line)}
#toasts{position:fixed;right:16px;bottom:16px;z-index:50;display:grid;gap:10px}
.toast{background:var(--panel2);border:1px solid var(--accent);border-radius:12px;padding:12px 16px;max-width:320px;box-shadow:0 12px 32px rgba(0,0,0,.4);animation:pop .5s cubic-bezier(.2,1.3,.4,1)}.toast b{display:block}
table.t{width:100%;border-collapse:collapse;font-size:14px}.t th,.t td{text-align:left;padding:9px 8px;border-bottom:1px solid var(--line);vertical-align:top}.t th{color:var(--muted);font-weight:600}
.scroll{overflow:auto}
@media(max-width:760px){.docs{grid-template-columns:1fr}.dnav{position:static;max-height:none;grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}.two{grid-template-columns:1fr}.kv{grid-template-columns:1fr}.live span{display:none}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header class="top">
  <a class="logo" href="#/"><i></i>Z Store</a>
  <nav id="nav">
    <a href="#/" data-r="">Toko</a>
    <a href="#/docs" data-r="docs">Dokumentasi</a>
    <a href="#/dev" data-r="dev">Developer</a>
  </nav>
  <span class="live" id="live" title="Realtime"><b></b><span id="live-t">offline</span></span>
</header>
<main id="main"></main>
<div id="toasts" aria-live="polite"></div>
<script>window.ZDOCS = {
 "pages": [
  {
   "group": "Mulai",
   "slug": "mulai-cepat",
   "title": "Mulai cepat",
   "html": "<p>Z Store adalah toko game dan aplikasi yang servernya berjalan di PC pemilik. Developer mengunggah berkas <code>.zip</code> atau <code>.exe</code>, mengisi dokumentasi, memilih batas usia, membayar biaya dokumentasi <b>{PRICE}</b>, lalu aplikasi tayang setelah verifikasi (minimal {MIN} menit).</p>\n<h2>Alurnya</h2>\n<ol><li><a href=\"#/docs/akun-developer\">Buat akun developer</a> dengan email (Gmail, Outlook, dll) dan verifikasi kode.</li><li>Tunggu verifikasi akun (minimal {MIN} menit).</li><li><a href=\"#/docs/upload\">Buat aplikasi baru</a>, isi <a href=\"#/docs/menulis-dokumentasi\">dokumentasi</a> dan pilih usia 1 sampai 18+.</li><li>Label <a href=\"#/docs/zsai\">ZSAI</a> dan <a href=\"#/docs/igrs\">IGRS</a> muncul otomatis.</li><li><a href=\"#/docs/upload\">Unggah berkas</a>.</li><li><a href=\"#/docs/pembayaran\">Bayar {PRICE}</a> lewat QR DANA, kirim nomor referensi.</li><li>Admin menyetujui, <a href=\"#/docs/verifikasi-aplikasi\">verifikasi aplikasi</a> berjalan, lalu tayang.</li></ol>\n<p>Begitu tayang, aplikasi langsung muncul di Z Store web dan Z Store Windows tanpa refresh (<a href=\"#/docs/realtime\">realtime</a>).</p>"
  },
  {
   "group": "Mulai",
   "slug": "istilah",
   "title": "Istilah penting",
   "html": "<table><tr><th>Istilah</th><th>Arti</th></tr>\n<tr><td>ZSAI</td><td>Z Store System Ages Indonesia, label usia buatan Z Store (1+ sampai 18+).</td></tr>\n<tr><td>IGRS</td><td>Indonesia Game Rating System: 3+, 7+, 13+, 15+, 18+.</td></tr>\n<tr><td>Dokumentasi</td><td>Halaman penjelasan aplikasi yang diisi developer. Publikasinya berbiaya {PRICE}.</td></tr>\n<tr><td>Server</td><td>Program <code>ZStore-Server.exe</code> yang berjalan di PC pemilik Z Store.</td></tr>\n<tr><td>Admin</td><td>Pemilik server; menyetujui pembayaran dan bisa menurunkan aplikasi.</td></tr></table>"
  },
  {
   "group": "Mulai",
   "slug": "faq",
   "title": "FAQ",
   "html": "<h2>Kenapa pembayaran tidak otomatis?</h2><p>DANA tidak menyediakan cara bagi akun biasa untuk mengecek pembayaran otomatis. Developer mengirim nomor referensi, admin mencocokkan dengan mutasi DANA, lalu menyetujui.</p>\n<h2>Apakah file saya discan antivirus?</h2><p>Tidak. Server hanya memeriksa struktur file (header ZIP atau Windows PE) dan menghitung SHA-256. Pengguna tetap perlu berhati-hati.</p>\n<h2>Bisa unggah selain zip/exe?</h2><p>Tidak. Hanya <code>.zip</code> dan <code>.exe</code>.</p>\n<h2>Kalau server PC mati?</h2><p>Toko tidak bisa diakses sampai server dinyalakan lagi. Data tersimpan di folder <code>ZStore-Data</code>.</p>\n<h2>Uang bayar kembali kalau ditolak?</h2><p>Kalau aplikasi gagal verifikasi otomatis, kamu bisa memperbaiki dan mengunggah ulang; hubungi admin untuk urusan pengembalian dana.</p>"
  },
  {
   "group": "Developer",
   "slug": "akun-developer",
   "title": "Akun developer",
   "html": "<p>Akun developer dibuat dari halaman <a href=\"#/dev\">Developer</a>.</p>\n<h2>Email yang diterima</h2><p>Gmail, Googlemail, Outlook, Hotmail, Live, MSN, Yahoo, iCloud, Proton, Zoho, GMX, Mail.com, Yandex, AOL. Domain lain ditolak.</p>\n<h2>Langkah verifikasi</h2>\n<ol><li>Isi nama developer, email, dan password (minimal 8 karakter).</li><li>Server mengirim kode 6 digit ke email (berlaku 10 menit, maksimal 5 kali salah).</li><li>Setelah kode benar, akun masuk tahap <b>verifikasi akun</b> selama minimal {MIN} menit. Selama itu kamu belum bisa membuat aplikasi.</li><li>Status berubah menjadi <b>terverifikasi</b> otomatis.</li></ol>\n<p>Kalau pemilik server belum mengatur SMTP, kode tidak terkirim lewat email dan hanya terlihat oleh admin. Minta kodenya ke admin.</p>"
  },
  {
   "group": "Developer",
   "slug": "upload",
   "title": "Mengunggah game / aplikasi",
   "html": "<ol><li>Portal Developer, klik <b>+ Aplikasi baru</b>, isi dokumentasi, klik <b>Simpan &amp; lanjut upload</b>.</li><li>Pilih berkas <code>.zip</code> atau <code>.exe</code>, klik <b>Unggah</b>.</li><li>Bayar dokumentasi dan kirim nomor referensi.</li></ol>\n<h2>Batas</h2><ul><li>Ukuran maksimal: sesuai pengaturan server (bawaan 1024 MB).</li><li>Satu aplikasi satu berkas. Unggah ulang akan mengganti berkas lama selama belum diproses.</li></ul>\n<h2>Pemeriksaan saat unggah</h2><p>ZIP harus berawalan <code>PK</code>; EXE harus berawalan <code>MZ</code>. Kalau tidak, ditolak.</p>"
  },
  {
   "group": "Developer",
   "slug": "format-zip",
   "title": "Format paket .zip",
   "html": "<p>Cocok untuk game atau aplikasi yang terdiri dari banyak file.</p>\n<pre><code>MyGame.zip\n├─ MyGame.exe        (file utama)\n├─ data/             (aset)\n└─ README.txt        (opsional)</code></pre>\n<ul><li>Taruh file utama di akar zip, jangan terbungkus folder berlapis.</li><li>Jangan sertakan file pribadi atau kunci rahasia.</li><li>Tulis nama file utama di kolom \"Cara instalasi / pakai\".</li></ul>"
  },
  {
   "group": "Developer",
   "slug": "format-exe",
   "title": "Format .exe",
   "html": "<p>Cocok untuk installer atau aplikasi satu file.</p>\n<ul><li>Harus berupa Windows executable (PE). Berkas bukan PE ditolak.</li><li>Sebaiknya ditandatangani kode (code-signing) agar SmartScreen tidak terlalu menakutkan pengguna.</li><li>Sebutkan kebutuhan sistem (Windows 10/11, 64-bit) di dokumentasi.</li></ul>"
  },
  {
   "group": "Developer",
   "slug": "menulis-dokumentasi",
   "title": "Menulis dokumentasi",
   "html": "<p>Dokumentasi adalah halaman yang dibaca pengguna sebelum mengunduh. Formulir meminta:</p>\n<table><tr><th>Kolom</th><th>Isi</th><th>Batas</th></tr>\n<tr><td>Nama</td><td>Nama tampil</td><td>2–50</td></tr><tr><td>Deskripsi singkat</td><td>Satu kalimat di kartu toko</td><td>10–120</td></tr>\n<tr><td>Dokumentasi lengkap</td><td>Fitur, kontrol, persyaratan, kredit</td><td>≥ 30</td></tr><tr><td>Cara instalasi / pakai</td><td>Langkah menjalankan</td><td>≥ 10</td></tr>\n<tr><td>Catatan versi</td><td>Apa yang baru (opsional)</td><td>≤ 10.000</td></tr><tr><td>Batas usia</td><td>1 sampai 18+</td><td>wajib</td></tr></table>\n<h2>Tips</h2><ul><li>Jelaskan apakah ada kekerasan, judi, kata kasar, pembelian dalam aplikasi, atau interaksi online.</li><li>Teks ditampilkan apa adanya (tanpa HTML).</li></ul>"
  },
  {
   "group": "Rating usia",
   "slug": "zsai",
   "title": "ZSAI (Z Store System Ages Indonesia)",
   "html": "<p><b>ZSAI</b> adalah sistem label usia Z Store. Developer memilih batas usia dari <b>1 sampai 18+</b>, lalu label muncul otomatis, misalnya <code>ZSAI 7+</code>.</p>\n<table><tr><th>Pilihan developer</th><th>Label ZSAI</th></tr><tr><td>1 tahun</td><td>ZSAI 1+</td></tr><tr><td>7 tahun</td><td>ZSAI 7+</td></tr><tr><td>12 tahun</td><td>ZSAI 12+</td></tr><tr><td>18+</td><td>ZSAI 18+</td></tr></table>\n<p>Konten 18+ ditandai merah dan diberi peringatan di halaman aplikasi. Lihat juga <a href=\"#/docs/panduan-usia\">panduan memilih usia</a> dan <a href=\"#/docs/igrs\">IGRS</a>.</p>"
  },
  {
   "group": "Rating usia",
   "slug": "igrs",
   "title": "IGRS",
   "html": "<p>Selain ZSAI, tiap aplikasi menampilkan label <b>IGRS</b> (Indonesia Game Rating System) yang diturunkan otomatis dari usia yang dipilih.</p>\n<table><tr><th>Usia dipilih</th><th>ZSAI</th><th>IGRS</th></tr>\n<tr><td>1 – 3</td><td>ZSAI 1+ … 3+</td><td>IGRS 3+</td></tr><tr><td>4 – 7</td><td>ZSAI 4+ … 7+</td><td>IGRS 7+</td></tr><tr><td>8 – 13</td><td>ZSAI 8+ … 13+</td><td>IGRS 13+</td></tr><tr><td>14 – 15</td><td>ZSAI 14+ … 15+</td><td>IGRS 15+</td></tr><tr><td>16 – 17</td><td>ZSAI 16+ … 17+</td><td>IGRS 18+</td></tr><tr><td>18+</td><td>ZSAI 18+</td><td>IGRS 18+</td></tr></table>\n<p>Jika ZSAI 18+, IGRS juga 18+. Usia 16–17 dinaikkan ke IGRS 18+ karena IGRS tidak punya kategori 16.</p>\n<p><b>Catatan:</b> label IGRS di Z Store diturunkan otomatis dari pilihan developer. Ini bukan klasifikasi resmi pemerintah.</p>"
  },
  {
   "group": "Rating usia",
   "slug": "panduan-usia",
   "title": "Panduan memilih usia",
   "html": "<table><tr><th>Kalau ada…</th><th>Pilih minimal</th></tr>\n<tr><td>Hanya konten anak, tanpa kekerasan</td><td>1–3</td></tr><tr><td>Kartun ringan, kekerasan sangat ringan</td><td>7</td></tr><tr><td>Konflik fantasi, horor ringan, chat online</td><td>13</td></tr><tr><td>Kekerasan sedang, tema gelap, darah</td><td>15</td></tr><tr><td>Kekerasan grafis, judi, konten dewasa, horor berat</td><td>18+</td></tr></table>\n<p>Memilih usia lebih rendah dari isi sebenarnya dapat membuat aplikasi diturunkan admin.</p>"
  },
  {
   "group": "Pembayaran & verifikasi",
   "slug": "pembayaran",
   "title": "Pembayaran {PRICE}",
   "html": "<p>Setiap aplikasi dikenai biaya dokumentasi <b>{PRICE}</b> (sekali per aplikasi).</p>\n<ol><li>Setelah berkas terunggah, halaman aplikasi menampilkan <b>QR DANA</b>.</li><li>Scan dengan DANA dan bayar tepat {PRICE}.</li><li>Isi <b>nomor referensi</b> dan <b>nama akun DANA</b> pengirim, klik <b>Saya sudah bayar</b>.</li><li>Status menjadi \"Pembayaran dicek admin\".</li></ol>\n<p>Satu nomor referensi hanya bisa dipakai sekali.</p>"
  },
  {
   "group": "Pembayaran & verifikasi",
   "slug": "persetujuan-pembayaran",
   "title": "Persetujuan pembayaran (admin)",
   "html": "<p>Admin membuka <code>#/admin</code> dan memasukkan password dari jendela server atau <code>ZStore-Data/config.json</code>.</p>\n<ol><li>Cek mutasi DANA: nominal {PRICE} dan nomor referensi cocok.</li><li><b>Setujui</b> bila cocok; verifikasi aplikasi dimulai. <b>Tolak</b> bila tidak, dengan alasan.</li></ol>"
  },
  {
   "group": "Pembayaran & verifikasi",
   "slug": "verifikasi-aplikasi",
   "title": "Verifikasi aplikasi",
   "html": "<p>Setelah pembayaran disetujui, aplikasi masuk masa verifikasi minimal <b>{MIN} menit</b>.</p>\n<ul><li>Bar progres menunjukkan sisa waktu.</li><li>Saat selesai, server memeriksa ulang berkas (ada, header sah).</li><li>Lolos: status <b>Tayang</b> dan disiarkan realtime. Gagal: <b>Ditolak</b>.</li></ul>"
  },
  {
   "group": "Pembayaran & verifikasi",
   "slug": "status",
   "title": "Arti status aplikasi",
   "html": "<table><tr><th>Status</th><th>Arti</th></tr><tr><td>Draf</td><td>Dokumentasi tersimpan, belum ada berkas.</td></tr><tr><td>Menunggu pembayaran</td><td>Berkas ada, belum bayar.</td></tr><tr><td>Pembayaran dicek admin</td><td>Menunggu persetujuan.</td></tr><tr><td>Verifikasi berjalan</td><td>Masa tunggu minimal {MIN} menit.</td></tr><tr><td>Tayang</td><td>Terlihat di toko.</td></tr><tr><td>Ditolak / diturunkan</td><td>Perbaiki dan unggah ulang.</td></tr></table>"
  },
  {
   "group": "Referensi",
   "slug": "api",
   "title": "API publik",
   "html": "<p>Basis: alamat server, mis. <code>http://localhost:8080</code>. Semua JSON.</p>\n<table><tr><th>Metode</th><th>Path</th><th>Fungsi</th></tr>\n<tr><td>GET</td><td>/api/info</td><td>Info toko (harga, lama verifikasi)</td></tr>\n<tr><td>GET</td><td>/api/apps?q=&amp;kind=game|app</td><td>Daftar aplikasi tayang</td></tr>\n<tr><td>GET</td><td>/api/apps/{id}</td><td>Detail</td></tr>\n<tr><td>GET</td><td>/api/apps/{id}/download</td><td>Unduh berkas</td></tr>\n<tr><td>GET</td><td>/api/events</td><td>Stream realtime (SSE)</td></tr></table>\n<pre><code>curl http://localhost:8080/api/apps</code></pre>"
  },
  {
   "group": "Referensi",
   "slug": "api-developer",
   "title": "API developer",
   "html": "<p>Header <code>Authorization: Bearer TOKEN</code> (token dari login).</p>\n<table><tr><th>Metode</th><th>Path</th><th>Fungsi</th></tr>\n<tr><td>POST</td><td>/api/dev/register</td><td>{email,name,password}</td></tr><tr><td>POST</td><td>/api/verify</td><td>{email,code} → token</td></tr><tr><td>POST</td><td>/api/dev/login</td><td>{email,password} → token</td></tr>\n<tr><td>GET</td><td>/api/dev/apps</td><td>Aplikasi milikmu</td></tr><tr><td>POST</td><td>/api/dev/apps</td><td>Buat (name,kind,category,version,short,desc,howTo,changelog,age)</td></tr>\n<tr><td>PUT</td><td>/api/dev/apps/{id}</td><td>Ubah</td></tr><tr><td>POST</td><td>/api/dev/apps/{id}/file</td><td>multipart field <code>file</code></td></tr><tr><td>POST</td><td>/api/dev/apps/{id}/pay</td><td>{ref,payer}</td></tr></table>\n<pre><code>curl -H \"Authorization: Bearer TOKEN\" -F file=@MyGame.zip \\\n  http://localhost:8080/api/dev/apps/ID/file</code></pre>"
  },
  {
   "group": "Referensi",
   "slug": "realtime",
   "title": "Realtime (SSE)",
   "html": "<p><code>GET /api/events</code> adalah Server-Sent Events. Event:</p>\n<ul><li><code>app_published</code>: data berisi ringkasan aplikasi baru.</li><li><code>app_removed</code>: data <code>{\"id\": \"...\"}</code>.</li></ul>\n<pre><code>const es = new EventSource('/api/events');\nes.addEventListener('app_published', e =&gt; console.log(JSON.parse(e.data)));</code></pre>\n<p>Z Store web dan Z Store Windows memakai stream ini, jadi daftar terbarui tanpa refresh.</p>"
  },
  {
   "group": "Referensi",
   "slug": "kebijakan",
   "title": "Kebijakan konten",
   "html": "<ul><li>Dilarang malware, spyware, miner tersembunyi, atau pencuri data.</li><li>Dilarang konten eksploitasi anak.</li><li>Dilarang melanggar hak cipta atau memalsukan merek.</li><li>Rating usia harus jujur.</li><li>Admin berhak menurunkan aplikasi tanpa pengembalian biaya bila melanggar.</li></ul>"
  },
  {
   "group": "Pengguna",
   "slug": "pengguna-windows",
   "title": "Z Store untuk Windows",
   "html": "<ol><li>Jalankan <code>ZStore-Setup.exe</code> (jika SmartScreen muncul: More info, Run anyway).</li><li>Masukkan alamat server (mis. <code>http://192.168.1.5:8080</code>).</li><li>Masuk dengan <b>Gmail</b>: kode 6 digit dikirim ke email.</li><li>Pilih aplikasi, klik <b>Unduh</b>. Berkas tersimpan di <code>Downloads\\Z Store</code>.</li></ol>\n<p>Aplikasi baru muncul sendiri dengan notifikasi (realtime).</p>"
  },
  {
   "group": "Pengguna",
   "slug": "keamanan-unduhan",
   "title": "Aman mengunduh",
   "html": "<ul><li>Cek label usia sebelum mengunduh.</li><li>Bandingkan SHA-256 yang tertera dengan berkas unduhanmu.</li><li>File tidak discan antivirus oleh Z Store; pindai sendiri sebelum menjalankan.</li></ul>"
  },
  {
   "group": "Server (PC pemilik)",
   "slug": "server-pc",
   "title": "Menjalankan server di PC",
   "html": "<ol><li>Ekstrak paket, jalankan <code>ZStore-Server.exe</code>. Jendela hitam harus tetap terbuka.</li><li>Buka <code>http://localhost:8080</code>.</li><li>Password admin tercetak di jendela dan tersimpan di <code>ZStore-Data/config.json</code>.</li></ol>\n<p>Data (akun, aplikasi, berkas) ada di folder <code>ZStore-Data</code> di samping exe. Cadangkan folder itu.</p>"
  },
  {
   "group": "Server (PC pemilik)",
   "slug": "jaringan",
   "title": "Akses dari perangkat lain",
   "html": "<ul><li><b>Satu WiFi:</b> pakai alamat <code>http://IP-PC:8080</code> yang tercetak di jendela server. Izinkan di Windows Firewall bila diminta.</li><li><b>Dari internet:</b> butuh port-forward di router atau layanan tunnel. Ini di luar paket; tanpa HTTPS, sebaiknya pakai tunnel yang menyediakan HTTPS.</li></ul>"
  },
  {
   "group": "Server (PC pemilik)",
   "slug": "smtp",
   "title": "Mengirim kode lewat email (SMTP)",
   "html": "<p>Edit <code>ZStore-Data/config.json</code>, lalu jalankan ulang server.</p>\n<pre><code>\"smtpHost\": \"smtp.gmail.com\",\n\"smtpPort\": 587,\n\"smtpUser\": \"emailkamu@gmail.com\",\n\"smtpPass\": \"APP-PASSWORD-16-HURUF\",\n\"smtpFrom\": \"emailkamu@gmail.com\"</code></pre>\n<p>Untuk Gmail buat <b>App Password</b> (butuh verifikasi 2 langkah). Tanpa SMTP, kode hanya tampil di panel admin.</p>"
  },
  {
   "group": "Server (PC pemilik)",
   "slug": "pengaturan",
   "title": "Pengaturan server",
   "html": "<table><tr><th>Kunci</th><th>Arti</th><th>Bawaan</th></tr><tr><td>port</td><td>Port web</td><td>8080</td></tr><tr><td>adminPassword</td><td>Password panel admin</td><td>acak</td></tr><tr><td>docPriceIDR</td><td>Biaya dokumentasi</td><td>15000</td></tr><tr><td>verifySeconds</td><td>Lama verifikasi (minimal 120)</td><td>120</td></tr><tr><td>maxUploadMB</td><td>Ukuran unggah maksimal</td><td>1024</td></tr></table>"
  },
  {
   "group": "Server (PC pemilik)",
   "slug": "masalah",
   "title": "Pemecahan masalah",
   "html": "<ul><li><b>Port sudah dipakai:</b> ubah <code>port</code> di config.</li><li><b>Tidak bisa dibuka dari HP:</b> cek Firewall dan pastikan satu WiFi.</li><li><b>Kode tidak masuk email:</b> cek folder spam atau atur SMTP; lihat panel admin.</li><li><b>Upload gagal:</b> pastikan .zip/.exe sah dan di bawah batas ukuran.</li></ul>"
  }
 ]
};

          h('td', {}, [a.status === 'published' ? h('button', { class: 'btn g s', text: 'Turunkan', onclick: function () { act(a.id, 'unpublish', prompt('Alasan?') || ''); } }) : null, ' ', h('button', { class: 'btn r s', text: 'Hapus', onclick: function () { if (confirm('Hapus ' + a.name + '?')) act(a.id, 'delete'); } })])])); });
        t.append(tb); body.append(h('div', { class: 'scroll' }, [t]));
        body.append(h('h2', { text: 'Akun (' + d.users.length + ')', style: 'margin-top:22px' }), h('div', { class: 'scroll' }, [h('table', { class: 't' }, [h('tbody', {}, d.users.map(function (u) { return h('tr', {}, [h('td', { text: u.email }), h('td', { text: u.name }), h('td', { text: u.dev ? 'developer · ' + u.devStatus : 'pengguna' })]); }))])]));
        every(4000, function () { if (location.hash === '#/admin') api('GET', '/admin/data', null, { admin: pw }).then(function (n) { if (JSON.stringify(n.apps.map(function (a) { return a.status; })) !== JSON.stringify(d.apps.map(function (a) { return a.status; })) || n.codes.length !== d.codes.length) load(); }).catch(function () {}); });
      }).catch(function (e) { login(pw ? e.message : ''); });
    }
    load();
  }

  /* ---------------- router ---------------- */
  function route() {
    clearTimers(); onLive = null; main.innerHTML = ''; document.title = 'Z Store';
    var p = location.hash.replace(/^#\/?/, '').split('/'), r = p[0] || '';
    [].forEach.call(document.querySelectorAll('#nav a'), function (a) { a.classList.toggle('on', a.dataset.r === (r === 'app' ? '' : r === 'admin' ? 'x' : r)); });
    window.scrollTo(0, 0);
    if (r === '') pageStore();
    else if (r === 'app') pageApp(p[1]);
    else if (r === 'docs') pageDocs(p[1]);
    else if (r === 'admin') pageAdmin();
    else if (r === 'dev') { if (p[1] === 'new') pageDevForm(null); else if (p[1] === 'app') pageDevForm(p[2]); else pageDev(); }
    else pageStore();
  }
  window.addEventListener('hashchange', route);
  api('GET', '/info').then(function (i) { INFO = i; }).catch(function () {}).then(function () { connect(); route(); });
})();
